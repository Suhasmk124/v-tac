services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: vtac
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_admin_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vtac_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtac"]
      interval: 3s
      retries: 20
volumes:
  vtac_data:
